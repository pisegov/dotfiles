# This is an example Hyprland config file.
#
# Refer to the wiki for more information.

#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#
# info at https://wiki.hyprland.org/
# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor=,preferred,auto,auto

# mirror two screens HDMI-A-1 to left of HDMI-A-2
# monitor=HDMI-A-1,1920x1080@60,0x0,1,mirror,HDMI-A-2
# monitor=,preferred,auto,1,mirror,HDMI-A-1

# Output
# Configure your Display resolution, offset, scale and Monitors here, use `hyprctl monitors` to get the info.

monitor=DP-3,2560x1440@165,0x0,1
#workspace=HDMI-A-1,1
#monitor=HDMI-A-2,1920x1080@60,1920x0,1
#workspace=HDMI-A-2,2

# Example :
#monitor=eDP-1,1920x1080@60,0x0,1
#monitor=eDP-1,transform,0
#monitor=eDP-1,addreserved,10,10,10,10
#workspace=eDP-1,1

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
# Setting variables
$mainMod = SUPER
$localBin = $HOME/.local/bin
$scriptsDir = $HOME/.config/hypr/scripts
$hyprDir = $HOME/.config/hypr
$term = kitty
$menu = $scriptsDir/menu
$fullmenu = $scriptsDir/fullmenu
$volume = $scriptsDir/volume
$backlight = $scriptsDir/brightness
$screenshot = $scriptsDir/screenshot
$lock = $scriptsDir/lockscreen
$screenshot_lock = $scriptsDir/screenshot-lock
$colorpicker = $scriptsDir/colorpicker
$wofi_beats = $scriptsDir/wofi-beats
$files = thunar
$browser = firefox
$editor = nvim

# Some default env vars
env = XCURSOR_SIZE,24
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_DEBUG_PLUGINS,1
env = QT_PLUGIN_PATH,'/usr/lib/qt/plugins'
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

env = WLR_RENDERER,vulkan
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = MOZ_ENABLE_WAYLAND,1
env = MOZ_USE_XINPUT2,1
env = __GL_GSYNC_ALLOWED,0
env = __GL_VRR_ALLOWED,0
env = SDL_VIDEODRIVER,wayland
env = _JAVA_AWT_WM_NONEREPARENTING,1

env = ELECTRON_OZONE_PLATFORM_HINT, auto
env = OBSIDIAN_DISABLE_GPU,1
env = OBSIDIAN_USE_WAYLAND,1
#
# Startup
exec-once = $scriptsDir/startup
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = $scriptsDir/portal
exec-once = syncthing
exec-once = emacs --daemon
exec-once = xhost si:localuser:root
exec-once = /usr/lib/kdeconnectd&!
exec-once = /usr/bin/indicator-kdeconnect&!
exec-once = safeeyes -e
exec-once = nm-applet
exec-once = pypr
exec-once = swww query || swww init
# exec-once = $scriptsDir/wallpaper.sh init
exec-once = wal -R
# exec-once = swaybg -m fill -i $HOME/Pictures/Wallpapers/tianshu-liu.jpg

# cursor {
#     no_hardware_cursors = true
# }

# with lock - hyprctl
exec-once = swayidle -w timeout 1200 '$screenshot_lock' timeout 1200 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on' before-sleep '$screenshot_lock'

# with lock - swaylock
# exec-once = swayidle -w timeout 1200 'swaylock -f -c 111111' timeout 1200 '' resume '' before-sleep 'swaylock -f -c 111111'

# without lock
# exec-once = swayidle -w  timeout 1200 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on'


# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
  # keyboard layout configuration
    kb_layout=us,ru

  # toggle works only for specific keyboard
  # switched it to binding
  # kb_options=grp:ctrl_space_toggle

  follow_mouse = 1
  numlock_by_default = 1

  touchpad {
    natural_scroll = true
    tap-to-click = true
    drag_lock = true
    disable_while_typing = true
  }

  #sensitivity = 0.0 # -1.0 - 1.0, 0 means no modification
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  mouse_move_enables_dpms = true
  no_direct_scanout = true #for fullscreen games
}

binds {
  workspace_back_and_forth = true
}

general {
  # See https://wiki.hyprland.org/Configuring/Variables/ for more

  gaps_in = 4
  gaps_out = 7
  border_size = 3

  #one color
  #col.active_border = rgba(7aa2f7aa)

  #two colors - gradient

  col.active_border = rgba(7aa2f7aa) rgba(c4a7e7aa) 45deg
  col.inactive_border = rgba(414868aa)

  layout = master
  #layout = dwindle
    #layout = workspacelayout
}

plugin {
# Plugin for perworkspace layouting
    wslayout {
        default_layout=master
    }
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10

    blur {
        enabled = true
        size = 3
        passes = 1
    }

    drop_shadow = true
    shadow_range = 4
    shadow_render_power = 3
    col.shadow = rgba(1a1a1aee)
}

# Blur waybar background
# blurls = waybar

animations {
  enabled = true

  # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

  bezier = myBezier, 0.05, 0.9, 0.1, 1.05

  animation = windows, 1, 7, myBezier
  animation = windowsOut, 1, 7, default, popin 80%
  animation = border, 1, 10, default
  animation = fade, 1, 7, default
  animation = workspaces, 1, 6, default
}

dwindle {
  # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
  pseudotile = true
  # preserve_split = true
  smart_split = true
}

master {
  # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
  new_is_master = false
  mfact = 0.5
  orientation = left
  allow_small_split = true
}

gestures {
  # See https://wiki.hyprland.org/Configuring/Variables/ for more
  workspace_swipe = false
  workspace_swipe_fingers = 3
}

group {
      col.border_active = rgba(7ed6b9aa)
      col.border_inactive = rgba(579480aa)

      groupbar {
       height = 8
       col.active = rgba(7ed6b9aa)
       col.inactive = rgba(414868aa)
      }
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
#device:epic mouse V1 {
#  sensitivity = -0.5
#}
device {
    name = ergohaven-k:02
    repeat_rate=35
    repeat_delay=200
    middle_button_emulation=0
}


# Workspaces orientation
# workspace = 1, layoutopt:orientation:top

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# Example windowrule v1
# windowrule = float, yad|nm-connection-editor|pavucontrol
# windowrule = float, feh|Gimp|qt5ct

# Example windowrule v2
windowrulev2 = tile, class:^(Spotify)$
windowrulev2 = tile, class:^(jetbrains-studio)$,title:^(.*Running Devices.*)$
windowrulev2 = tile, class:^(jetbrains-studio)$,title:^(.*Project.*)$
windowrulev2 = tile, class:^(jetbrains-studio)$,title:^(.*Terminal.*)$
windowrulev2 = tile, class:^(jetbrains-studio)$,title:^(.*Build.*)$
windowrulev2 = tile, class:^(jetbrains-studio)$,title:^(.*Logcat.*)$
windowrulev2 = tile, class:^(jetbrains-studio)$,title:^(.*Device Manager.*)$
windowrulev2 = tile, class:^(jetbrains-studio)$,title:^(.*Version Control.*)$
windowrulev2 = tile, class:^(jetbrains-studio)$,title:^(.*Run.*)$
windowrulev2 = group set, class:^(jetbrains-studio)$,title:^(.*Terminal.*)$
windowrulev2 = group set, class:^(jetbrains-studio)$,title:^(.*Terminal.*)$
windowrulev2 = nofocus, class:^(jetbrains-studio)$,title:^(.*win.*)$


# windowrulev2 = workspace 4, class:^(Apache Directory Studio)$
# windowrulev2 = bordercolor rgb(EE4B55) rgb(880808), fullscreen:1
# windowrulev2 = bordercolor rgb(282737) rgb(1E1D2D), floating:1
# windowrulev2 = opacity 0.8 0.8, pinned:1
# windowrulev2 = workspace 10, class:^(Microsoft-edge)$
# windowrulev2 = workspace 8 silent, class^(Steam)$, title:^(Steam)$
# windowrulev2 = float,class:^(firefox)$,title:^(Picture-in-Picture)$

# for waybar yay update click
windowrulev2 = animation popin, class:^(update)$, title:^(update)$
windowrulev2 = float, class:^(update)$, title:^(update)$
windowrulev2 = size 60% 50%, class:^(update)$, title:^(update)$
windowrulev2 = center, class:^(update)$, title:^(update)$

# for ttyclock
windowrulev2 = float, class:^(clock)$, title:^(clock)$
windowrulev2 = size 33% 27%, class:^(clock)$, title:^(clock)$
windowrulev2 = center, class:^(clock)$, title:^(clock)$

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = CTRL, Space, exec, hyprskl next > /dev/null
bind = ALT SHIFT, escape, exec, $screenshot_lock
bind = ALT SHIFT, R, exec, hyprctl reload
bind = $mainMod SHIFT, D, exec, $fullmenu
bind = ALT, Space, exec, $menu
bind = ALT SHIFT, Q, killactive
bind = $mainMod SHIFT, Return, exec, emacsclient -c -a 'emacs'
bind = $mainMod, F, fullscreen
bind = $mainMod, C, exec, conky-toggle
bind = $mainMod SHIFT, F, togglefloating
bind = $mainMod SHIFT, B, exec, safeeyes --take-break
bind = ALT, R, exec, rofi-theme-selector
bind = $mainMod, Return, exec, $term
bind = $mainMod, V, exec, pavucontrol
bind = $mainMod, B, exec, $scriptsDir/statusbar

bind = CTRL ALT, A, exec, xfce4-appfinder
bind = CTRL ALT, C, exec, catfish
bind = CTRL ALT, B, exec, $files
bind = CTRL ALT, E, exec, archlinux-tweak-tool
bind = CTRL ALT, F, exec, firefox
bind = CTRL ALT, G, exec, chromium -no-default-browser-check
bind = CTRL ALT, I, exec, nitrogen
bind = CTRL ALT, K, exec, $scriptsDir/lockscreen
bind = CTRL ALT, L, exec, $scriptsDir/lockscreen
bind = CTRL ALT, NEXT, exec, conky-rotate -n
bind = CTRL ALT, P, exec, pamac-manager
bind = CTRL ALT, PREVIOUS, exec, conky-rotate -p
bind = CTRL ALT, R, exec, rofi-theme-selector
bind = CTRL ALT, Return, exec, foot
bind = CTRL ALT, S, exec, spotify
bind = CTRL ALT, T, exec, $term
bind = CTRL ALT, U, exec, pavucontrol
bind = CTRL ALT, V, exec, vivaldi-stable
bind = CTRL ALT, W, exec, arcolinux-welcome-app

bind = CTRL SHIFT, Escape, exec, $term --class btop -T btop -e btop
bind = CTRL ALT, END, exec, $term --class btop -T btop -e btop

