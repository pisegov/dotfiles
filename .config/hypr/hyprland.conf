# effect
bind = ALT, g, exec, $scriptsDir/glassmorphismToggle

bind = ALT, F3, exec, xfce4-appfinder

bind = , F12, exec, xfce4-terminal --drop-down

# bind = $mainMod SHIFT, M, exec, hyprctl dispatch splitratio -0.1
# bind = $mainMod, M, exec, hyprctl dispatch splitratio 0.1

# bind = $mainMod SHIFT, Y, exec, $term --class clock -T clock -e tty-clock -c -C 7 -r -s -f "%A, %B, %d"
# bind = $mainMod, D, layoutmsg, removemaster
# bind = $mainMod, Escape, exec, hyprctl kill
bind = $mainMod, A, layoutmsg, addmaster
bind = $mainMod SHIFT, A, layoutmsg, removemaster
# bind = $mainMod, J, layoutmsg, cyclenext
# bind = $mainMod, K, layoutmsg, cycleprev

# bind = $mainMod, P, pseudo
bind = $mainMod CTRL, Return, layoutmsg, swapwithmaster
bind = $mainMod, Space, exec, $scriptsDir/changeLayout
bind = $mainMod, X, exec, $scriptsDir/logout-utility
bind = $mainMod SHIFT, X, exec, arcolinux-powermenu
# bind = $mainMod, Y, exec, $term --class update -T update -e cava # f to cycle through foreground colors

# Mainmod + Function keys
bind = $mainMod, F1, exec, $browser
bind = $mainMod, F2, exec, $editor
bind = $mainMod, F3, exec, inkscape
bind = $mainMod, F4, exec, gimp
bind = $mainMod, F5, exec, meld
bind = $mainMod, F6, exec, vlc
bind = $mainMod, F7, exec, virtualbox
bind = $mainMod, F8, exec, $files
bind = $mainMod, F9, exec, lollypop
bind = $mainMod, F10, exec, spotify
bind = $mainMod, F11, exec, rofi -show drun
bind = $mainMod, F12, exec, rofi -show drun

# Special Keys
bind = , xf86audioraisevolume, exec, $volume --inc
bind = , xf86audiolowervolume, exec, $volume --dec
bind = , xf86audiomute, exec, $volume --toggle
bind = , xf86audioplay, exec, playerctl play-pause
bind = , xf86audionext, exec, playerctl next
bind = , xf86audioprev, exec, playerctl previous
bind = , xf86audiostop, exec, playerctl stop
bind = , xf86monbrightnessup, exec, $brightness --inc
bind = , xf86monbrightnessdown, exec, $brightness --dec

# Backlight control
bind = $mainMod SHIFT, equal, submap, backlight
submap = backlight
bind = , equal, exec, $backlight --inc
bind = , minus, exec, $backlight --dec
bind = , escape, submap, reset
submap = reset

# Volume control
bind = $mainMod, equal, submap, volume
submap = volume
bind = , equal, exec, $volume --inc
bind = , minus, exec, $volume --dec
bind = , 0, exec, $volume --toggle
bind = , 9, exec, $volume --toggle-mic
bind = , escape, submap, reset
submap = reset

# Resize

#binde = $mainMod CTRL, H, resizeactive,-50 0
#binde = $mainMod CTRL, L, resizeactive,50 0
binde = $mainMod CTRL, K, resizeactive,0 -50
binde = $mainMod CTRL, J, resizeactive,0 50
binde = $mainMod CTRL, H, exec, hyprctl dispatch splitratio -0.1 
binde = $mainMod CTRL, L, exec, hyprctl dispatch splitratio 0.1 

# Move
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Scratchpads
bind = ALT SHIFT, U, exec, pypr toggle term
bind = ALT SHIFT, P, exec, pypr toggle pavu
bind = ALT SHIFT, I, exec, pypr toggle vim
bind = ALT SHIFT, Y, exec, pypr toggle yazi

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
# bind = $mainMod, period, workspace, e+1
# bind = $mainMod, comma, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod, G, togglegroup
bind = $mainMod, N, changegroupactive, f
bind = $mainMod, P, changegroupactive, b 

bind = $mainMod, tab, workspace, m+1
bind = $mainMod SHIFT, tab, workspace, m-1
bind = ALT, tab, workspace, m+1
bind = ALT SHIFT, tab, workspace, m-1

# bind = $mainMod, O, exec, $colorpicker
# bind = $mainMod SHIFT, O, exec, $term --class hyprpicker --hold -e hyprpicker
bind = $mainMod CTRL, S, exec, $wofi_beats

# Screenshot keybindings
bind = , Print, exec, $screenshot --area
bind = $mainMod SHIFT, Print, exec, $screenshot --now
# bind = SHIFT, Print, exec, $screenshot --in10
# bind = CTRL, Print, exec, $screenshot --win
# bind = $mainMod CTRL, Print, exec, flameshot gui

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, q, workspace, 1
bind = $mainMod, w, workspace, 2
bind = $mainMod, e, workspace, 3
bind = $mainMod, r, workspace, 4
bind = $mainMod, t, workspace, 5
bind = $mainMod, y, workspace, 6
bind = $mainMod, u, workspace, 7
bind = $mainMod, i, workspace, 8
bind = $mainMod, o, workspace, 9

# Move active window and follow to workspace
bind = $mainMod CTRL, q, movetoworkspace, 1
bind = $mainMod CTRL, w, movetoworkspace, 2
bind = $mainMod CTRL, e, movetoworkspace, 3
bind = $mainMod CTRL, r, movetoworkspace, 4
bind = $mainMod CTRL, t, movetoworkspace, 5
bind = $mainMod CTRL, y, movetoworkspace, 6
bind = $mainMod CTRL, u, movetoworkspace, 7
bind = $mainMod CTRL, i, movetoworkspace, 8
bind = $mainMod CTRL, o, movetoworkspace, 9
bind = $mainMod CTRL, bracketleft, movetoworkspace, -1
bind = $mainMod CTRL, bracketright, movetoworkspace, +1

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, q, movetoworkspacesilent, 1
bind = $mainMod SHIFT, w, movetoworkspacesilent, 2
bind = $mainMod SHIFT, e, movetoworkspacesilent, 3
bind = $mainMod SHIFT, r, movetoworkspacesilent, 4
bind = $mainMod SHIFT, t, movetoworkspacesilent, 5
bind = $mainMod SHIFT, y, movetoworkspacesilent, 6
bind = $mainMod SHIFT, u, movetoworkspacesilent, 7
bind = $mainMod SHIFT, i, movetoworkspacesilent, 8
bind = $mainMod SHIFT, o, movetoworkspacesilent, 9
bind = $mainMod SHIFT, bracketleft, movetoworkspacesilent, -1
bind = $mainMod SHIFT, bracketright, movetoworkspacesilent, +1

