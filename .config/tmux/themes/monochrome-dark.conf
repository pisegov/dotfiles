# IlyasYOY Monochrome Dark — tmux theme
# Ported from https://github.com/IlyasYOY/dotfiles/blob/master/config/nvim/colors/ilyasyoy-monochrome.lua

# Pane borders
set -g pane-border-style "fg=#303030"
set -g pane-active-border-style "fg=#909090"

# Status bar
set -g status-style "bg=#1c1c1c,fg=#dadada"
set -g status-position top

# Status left: session name
set -g status-left "#[bg=#dadada,fg=#222222,bold] #S #[bg=#1c1c1c,fg=#dadada] "
set -g status-left-length 30

# Status right: directory and time
set -g status-right "#[fg=#909090]#{b:pane_current_path} #[fg=#dadada,bg=#303030] %H:%M "
set -g status-right-length 50

# Window list
set -g window-status-format "#[fg=#909090] #I #W "
set -g window-status-current-format "#[fg=#dadada,bg=#303030,bold] #I #W#{?window_zoomed_flag,(),} "
set -g window-status-separator ""

# Messages
set -g message-style "bg=#303030,fg=#dadada"
set -g message-command-style "bg=#303030,fg=#dadada"

# Copy mode
set -g mode-style "bg=#303030,fg=#ffaf00"

# Clock
set -g clock-mode-colour "#dadada"

# Bell
set -g window-status-bell-style "bg=#722529,fg=#dadada"
