# IlyasYOY Monochrome Light — tmux theme
# Ported from https://github.com/IlyasYOY/dotfiles/blob/master/config/nvim/colors/ilyasyoy-monochrome.lua

# Pane borders
set -g pane-border-style "fg=#d7d7d7"
set -g pane-active-border-style "fg=#626262"

# Status bar
set -g status-style "bg=#d7d7d7,fg=#000000"
set -g status-position top

# Status left: session name
set -g status-left "#[bg=#000000,fg=#eeeeee,bold] #S #[bg=#d7d7d7,fg=#000000] "
set -g status-left-length 30

# Status right: directory and time
set -g status-right "#[fg=#626262]#{b:pane_current_path} #[fg=#000000,bg=#e4e4e4] %H:%M "
set -g status-right-length 50

# Window list
set -g window-status-format "#[fg=#626262] #I #W "
set -g window-status-current-format "#[fg=#000000,bg=#e4e4e4,bold] #I #W#{?window_zoomed_flag,(),} "
set -g window-status-separator ""

# Messages
set -g message-style "bg=#e4e4e4,fg=#000000"
set -g message-command-style "bg=#e4e4e4,fg=#000000"

# Copy mode
set -g mode-style "bg=#e4e4e4,fg=#ffaf00"

# Clock
set -g clock-mode-colour "#000000"

# Bell
set -g window-status-bell-style "bg=#da8d8d,fg=#000000"
